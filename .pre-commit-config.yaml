# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_stages: [commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        types_or: [c, c++]
      - id: end-of-file-fixer
        types_or: [c, c++]
      - id: check-merge-conflict
      - id: mixed-line-ending
        types_or: [c, c++, text]
        args: ['--fix=lf']
        description: Forces to replace line ending by the UNIX 'lf' character
  
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
  
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        args: ['--style=file']
        # Skip generated / vendored bulk-data files. clang-format degrades to
        # ~O(n²) or worse on tens-of-thousands-of-lines brace-initializer
        # arrays (LVGL font tables, PP-OCRv6 dict), effectively hanging the
        # hook. These files are auto-generated and re-emitted by their
        # respective tools; formatting them by hand would just be overwritten.
        exclude: |
          (?x)^(
            examples/pp_ocr_v6/main/assets/pp_ocr_v6_cjk_.*\.c
            | components/who_peripherals/who_lcd/who_lvgl_utils/montserrat_bold_.*\.c
            | examples/object_tracking/components/bytetrack/.*
            | .*/managed_components/.*
            | .*/build/.*
          )$



  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [--config=.codespellrc]
